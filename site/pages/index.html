<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="description" content="值得关注的资讯、可复用的实践经验与踩坑记录。">
  <title>Wiki Hub</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <script src="assets/theme.js?v={{ASSET_REV}}"></script>
  <script src="assets/header.js?v={{ASSET_REV}}" defer></script>
  <link rel="stylesheet" href="assets/wiki-hub.css?v={{ASSET_REV}}">
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <button class="drawer-backdrop" type="button" aria-label="关闭菜单" hidden></button>
    <div class="shell site-header-inner">
      <a class="site-brand" href="./" aria-label="Wiki Hub 首页"><span class="brand-mark" aria-hidden="true">W</span><span>Wiki Hub</span></a>
      <div class="site-drawer" id="site-drawer">
        <div class="drawer-header">
          <a class="site-brand" href="./" aria-label="Wiki Hub 首页"><span class="brand-mark" aria-hidden="true">W</span><span>Wiki Hub</span></a>
          <button class="drawer-close" type="button" aria-label="关闭菜单"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
      <nav class="site-nav" id="site-nav" aria-label="主导航">
        <a class="site-nav-link is-active" href="./" aria-current="page">首页</a>
        <a class="site-nav-link" href="news/">资讯干货</a>
        <a class="site-nav-link" href="practices/">实践经验</a>
        <a class="site-nav-link" href="notes/">踩坑记录</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="切换深色模式" hidden>
        <svg class="theme-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13.2A9 9 0 0 1 10.8 3.1 9 9 0 1 0 20.9 13.2Z"/></svg>
        <svg class="theme-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
      </button>
      </div>
      <button class="nav-toggle" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="site-drawer" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path class="nav-line-top" d="M4 6h16"/><path class="nav-line-middle" d="M4 12h16"/><path class="nav-line-bottom" d="M4 18h16"/></svg>
      </button>
    </div>
  </header>
  <main id="main" class="shell home-page">
    <section class="home-latest" aria-labelledby="latest-heading">
      <div class="home-section-heading"><h1 id="latest-heading">最新资讯</h1><a href="news/">全部资讯 <span aria-hidden="true">→</span></a></div>
      <!--HOME_LATEST-->
    </section>
    <div class="home-articles">
      <section aria-labelledby="practices-heading"><div class="home-section-heading"><h2 id="practices-heading">实践经验</h2><a href="practices/">查看全部 <span aria-hidden="true">→</span></a></div><!--HOME_PRACTICES--></section>
      <section aria-labelledby="notes-heading"><div class="home-section-heading"><h2 id="notes-heading">踩坑记录</h2><a href="notes/">查看全部 <span aria-hidden="true">→</span></a></div><!--HOME_NOTES--></section>
    </div>
  </main>
</body>
</html>
