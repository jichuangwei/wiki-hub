<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="description" content="Wiki Hub 按周整理值得关注的资讯，支持分类与周次筛选。">
  <title>资讯干货 · Wiki Hub</title>
  <link rel="icon" type="image/svg+xml" href="{{SITE_ROOT}}assets/favicon.svg">
  <script src="{{SITE_ROOT}}assets/theme.js?v={{ASSET_REV}}"></script>
  <script src="{{SITE_ROOT}}assets/header.js?v={{ASSET_REV}}" defer></script>
  <link rel="stylesheet" href="{{SITE_ROOT}}assets/wiki-hub.css?v={{ASSET_REV}}">
  <style>{{EMAIL_STYLES}}</style>
  <script src="{{SITE_ROOT}}assets/news-filter.js?v={{ASSET_REV}}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <button class="drawer-backdrop" type="button" aria-label="关闭菜单" hidden></button>
    <div class="shell site-header-inner">
      <a class="site-brand" href="{{SITE_ROOT}}" aria-label="Wiki Hub 首页"><span class="brand-mark" aria-hidden="true">W</span><span>Wiki Hub</span></a>
      <div class="site-drawer" id="site-drawer">
        <div class="drawer-header">
          <a class="site-brand" href="{{SITE_ROOT}}" aria-label="Wiki Hub 首页"><span class="brand-mark" aria-hidden="true">W</span><span>Wiki Hub</span></a>
          <button class="drawer-close" type="button" aria-label="关闭菜单"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
      <nav class="site-nav" id="site-nav" aria-label="主导航">
        <a class="site-nav-link" href="{{SITE_ROOT}}">首页</a>
        <a class="site-nav-link is-active" href="{{SITE_ROOT}}news/" aria-current="page">资讯干货</a>
        <a class="site-nav-link" href="{{SITE_ROOT}}practices/">实践经验</a>
        <a class="site-nav-link" href="{{SITE_ROOT}}notes/">踩坑记录</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="切换深色模式" hidden>
        <svg class="theme-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13.2A9 9 0 0 1 10.8 3.1 9 9 0 1 0 20.9 13.2Z"/></svg>
        <svg class="theme-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
      </button>
      </div>
      <button class="nav-toggle" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="site-drawer" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path class="nav-line-top" d="M4 6h16"/><path class="nav-line-middle" d="M4 12h16"/><path class="nav-line-bottom" d="M4 18h16"/></svg>
      </button>
    </div>
  </header>
  <main id="main" class="shell">
    <section class="news-section" aria-label="资讯列表">
      <div class="filters-row">
        <div class="category-picker">
          <button class="category-trigger filter-trigger" type="button" aria-label="选择分类" aria-expanded="false" aria-controls="category-menu" hidden><span id="category-current">全部分类</span><span class="week-chevron" aria-hidden="true"></span></button>
          <div class="category-tabs" id="category-menu" role="group" aria-label="按分类筛选资讯">{{CATEGORY_TABS}}</div>
        </div>
        <div class="week-picker">
          <button class="week-trigger filter-trigger" id="week-trigger" type="button" aria-label="选择周次" aria-expanded="false" aria-controls="week-menu"><span id="week-current" class="week-long">{{CURRENT_WEEK}}</span><span class="week-chevron" aria-hidden="true"></span></button>
          <div class="week-menu" id="week-menu" role="listbox" aria-label="周次" hidden>{{WEEK_OPTIONS}}</div>
        </div>
      </div>
      <div class="weekly-reports">{{WEEKLY_REPORTS}}</div>
      <div class="content-empty" id="empty-state" hidden>
        <svg class="content-empty-icon" width="42" height="42" viewBox="0 0 42 42" fill="none" aria-hidden="true">
          <rect x="9" y="6" width="24" height="30" rx="4" stroke="currentColor" stroke-width="1.8"/>
          <path d="M15 16h12M15 22h12M15 28h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <p>暂无匹配的资讯</p>
        <span>试试其他分类或周次。</span>
      </div>
    </section>
  </main>

</body>
</html>
