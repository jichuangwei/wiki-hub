<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="description" content="Wiki Hub 按周整理值得关注的资讯，支持分类与周次筛选。">
  <title>最新资讯 · Wiki Hub</title>
  <link rel="stylesheet" href="assets/wiki-hub.css?v={{ASSET_REV}}">
  <style>{{EMAIL_STYLES}}</style>
  <script src="assets/news-filter.js?v={{ASSET_REV}}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <main id="main" class="shell">
    <section class="news-section" aria-label="资讯列表">
      <div class="filters-row">
        <div class="category-tabs" role="group" aria-label="按分类筛选资讯">{{CATEGORY_TABS}}</div>
        <div class="week-picker">
          <button class="week-trigger" id="week-trigger" type="button" aria-label="选择周次" aria-expanded="false" aria-controls="week-menu"><span id="week-current">{{CURRENT_WEEK}}</span><span class="week-chevron" aria-hidden="true"></span></button>
          <div class="week-menu" id="week-menu" role="listbox" aria-label="周次" hidden>{{WEEK_OPTIONS}}</div>
        </div>
      </div>
      <div class="weekly-reports">{{WEEKLY_REPORTS}}</div>
      <p class="empty-state" id="empty-state" hidden>这一周没有匹配的资讯，请调整分类。</p>
    </section>
  </main>

</body>
</html>
